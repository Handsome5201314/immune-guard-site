<style>
/* ===== 隐私与数据说明专属 ===== */
.legal-alert{display:flex;gap:14px;align-items:flex-start;background:#FEF6E7;border:1px solid #FDE4B5;border-radius:var(--r-card);padding:22px 24px}
.legal-alert .ic{width:22px;height:22px;color:var(--amber-ink);margin-top:2px;flex:none}
.legal-alert h3{font-size:16.5px;color:#7C4A03}
.legal-alert p{font-size:14.5px;color:#7C4A03;line-height:1.75;margin-top:6px}
.scope-tbl td:first-child{white-space:normal;min-width:110px}
.scope-tbl code{font-family:var(--mono);font-size:12.5px;background:var(--bg-tint);border-radius:4px;padding:1px 5px;color:var(--ink-2)}
.flow-mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:6px}
.flow-mini div{background:#fff;border:1px solid var(--line);border-radius:var(--r-small);padding:18px;font-size:14px;line-height:1.65;color:var(--ink-2)}
.flow-mini b{display:block;font-size:14.5px;color:var(--ink);margin-bottom:5px}
.legal-doc{border:1px dashed #CBD5E1;border-radius:var(--r-card);padding:26px;background:#fff}
.legal-doc h3{font-size:18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.legal-doc .badge{font-size:11.5px;font-weight:600;color:#B45309;background:#FEF6E7;border:1px solid #FDE4B5;border-radius:6px;padding:2px 8px}
.legal-doc p{margin-top:10px;font-size:14.5px;color:var(--ink-2);line-height:1.75}
.legal-doc ul{margin-top:12px;display:grid;gap:8px}
.legal-doc li{font-size:14px;color:var(--ink-3);line-height:1.65;display:flex;gap:9px}
.legal-doc li .ic{width:15px;height:15px;margin-top:4px;color:var(--ink-4)}
@media (max-width:1023px){.flow-mini{grid-template-columns:minmax(0,1fr)}}
@media (max-width:639px){.legal-alert{padding:18px}.legal-doc{padding:20px}}
</style>
</head>
