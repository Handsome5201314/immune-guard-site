<style>
/* ===== 首页专属 ===== */
.hero{overflow:hidden;background:radial-gradient(1100px 520px at 8% -8%,rgba(16,185,129,.16),transparent 60%),radial-gradient(900px 420px at 92% 0%,rgba(139,124,246,.1),transparent 60%)}
.hero-grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);align-items:center;gap:40px;min-height:calc(100vh - var(--nav-h));padding:48px 0 56px}
@supports (height:100svh){.hero-grid{min-height:calc(100svh - var(--nav-h))}}
.hero-copy h1{margin-top:20px;font-size:60px;font-weight:600;line-height:1.16;letter-spacing:-.022em}
.hero-copy h1 span{display:block}
.hero-copy h1 .hl{color:var(--green-ink)}
.hero-sub{margin:18px 0 28px;font-size:18px;color:var(--ink-2);max-width:520px;line-height:1.75}
.hero-actions{display:flex;flex-wrap:wrap;gap:12px}
.hero-visual{position:relative;min-height:560px}
.hv-stage{position:absolute;inset:0;display:grid;place-items:center}
.hv-ring{position:absolute;width:520px;height:520px;border-radius:50%;border:1px solid rgba(16,185,129,.18)}
.hv-ring.r2{width:660px;height:660px;border-color:rgba(16,185,129,.08)}
.hv-halo{position:absolute;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(16,185,129,.2),rgba(16,185,129,0) 68%)}
.hv-ip{position:relative;z-index:3;width:360px;max-width:70%;filter:drop-shadow(0 30px 40px rgba(6,95,70,.25))}
.hv-phone{position:absolute;right:0;bottom:6%;z-index:4}
.hv-chip{position:absolute;z-index:5;display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:10px 14px;font-size:13px;line-height:1.5;color:var(--ink-2);white-space:nowrap}
.hv-chip b{color:var(--ink);font-weight:600}
.hv-chip .ic{width:16px;height:16px;color:var(--green)}
.hv-chip-a{left:0;top:26%}
.hv-chip-b{left:6%;bottom:10%}
.hv-chip-c{right:4%;top:8%;border-color:#FDE4B5;background:#FFF9EC;color:var(--amber-ink)}
.hv-chip-c .ic{color:var(--amber)}
@media (min-width:1024px) and (prefers-reduced-motion:no-preference){
  .hv-ip{animation:floatY 7s ease-in-out infinite}
  .hv-phone{animation:floatY 7s ease-in-out -3.5s infinite}
  .hv-chip-a{animation:floatY 7s ease-in-out -1.5s infinite}
  .hv-chip-b{animation:floatY 7s ease-in-out -5s infinite}
}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

.idea-list{display:grid;border:1px solid var(--line);border-radius:var(--r-card);background:#fff;overflow:hidden}
.idea{display:grid;grid-template-columns:56px minmax(0,1fr) minmax(0,1.3fr);gap:20px;padding:24px 28px;align-items:start;border-top:1px solid var(--line-2);transition:background .2s}
.idea:first-child{border-top:0}
.idea:hover{background:var(--bg-tint)}
.idea-no{font-size:14px;font-weight:700;color:var(--green-ink);background:var(--green-bg);border-radius:10px;width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.idea h3{font-size:18px}
.idea p{font-size:15px;color:var(--ink-2);line-height:1.75}

.persona{position:relative;padding:28px;border-radius:var(--r-card);border:1px solid var(--line);background:#fff;overflow:hidden;display:flex;flex-direction:column;min-height:100%}
.persona::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:var(--pc,var(--green))}
.persona-head{display:flex;align-items:center;gap:14px}
.persona-av{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;color:#fff;background:var(--pc,var(--green));flex:none}
.persona h3{font-size:18px}
.persona .role{font-size:13px;color:var(--ink-3)}
.persona dl{margin-top:18px;display:grid;gap:14px;flex:1;align-content:start}
.persona dt{font-size:12.5px;font-weight:600;color:var(--ink-4);letter-spacing:.04em;margin-bottom:4px}
.persona dd{font-size:14.5px;color:var(--ink-2);line-height:1.7}
.persona dd.help{color:var(--ink);background:var(--bg-tint);border-radius:10px;padding:10px 12px}
.persona dd.help b{color:var(--green-ink)}

.flow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.flow-step{background:#fff;border:1px solid var(--line);border-radius:var(--r-card);padding:26px;position:relative}
.flow-step .card-icon{width:42px;height:42px}
.flow-step h3{margin-top:16px;font-size:19px}
.flow-step p{margin-top:6px;font-size:14.5px;color:var(--ink-2)}
.flow-step .step-tag{position:absolute;top:22px;right:22px;font-size:11.5px;font-weight:700;color:var(--ink-4);letter-spacing:.1em}
.flow-arrow{display:none}

.dual{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.dual-card{border-radius:var(--r-card);padding:28px;color:#fff;position:relative;overflow:hidden;min-height:320px}
.dual-score{background:linear-gradient(150deg,#065F46,#047857 60%,#059669)}
.dual-vp{background:linear-gradient(150deg,#4C3FA0,#5B4DC4 55%,#8B7CF6)}
.dual-card::after{content:"";position:absolute;right:-60px;bottom:-80px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.08)}
.dual-card .dk{font-size:13px;font-weight:600;opacity:.85;letter-spacing:.02em}
.dual-card h3{margin-top:6px;font-size:24px;color:#fff}
.dual-card .en{font-size:12.5px;opacity:.65;margin-top:2px}
.dual-card .dv{font-size:54px;font-weight:600;line-height:1;margin-top:20px}
.dual-card .dv small{font-size:16px;font-weight:500;opacity:.7;margin-left:4px}
.dual-card ul{margin-top:18px;display:grid;gap:7px;font-size:14px;opacity:.92}
.dual-card ul li{display:flex;gap:8px;align-items:flex-start;line-height:1.55}
.dual-card ul li .ic{width:16px;height:16px;margin-top:3px;opacity:.8}
.dual-card .dv-note{margin-top:14px;font-size:12.5px;opacity:.75}
.dual-vs{grid-column:1/-1;text-align:center;font-size:15px;color:var(--ink-3);margin-top:-4px}
.dual-vs b{color:var(--ink)}

.feat-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.feat{display:flex;gap:14px;padding:20px;border:1px solid var(--line);border-radius:var(--r-small);background:#fff;transition:border-color .2s,transform .2s var(--ease);align-items:flex-start}
.feat:hover{border-color:var(--green-border);transform:translateY(-2px)}
.feat .card-icon{width:40px;height:40px;border-radius:11px}
.feat .card-icon .ic{width:19px;height:19px}
.feat h3{font-size:16.5px;margin-top:0}
.feat p{font-size:14px;margin-top:3px}

.compare{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.compare-col{border-radius:var(--r-card);padding:26px;border:1px solid var(--line)}
.compare-col.old{background:#fff}
.compare-col.new{background:var(--green-bg);border-color:var(--green-border)}
.compare-col h3{font-size:18px}
.compare-col ul{margin-top:14px;display:grid;gap:10px;font-size:15px;color:var(--ink-2)}
.compare-col ul li{display:flex;gap:10px;line-height:1.6}
.compare-col ul li .ic{width:18px;height:18px;margin-top:3px;flex:none}
.compare-col.old ul li .ic{color:var(--ink-4)}
.compare-col.new ul li .ic{color:var(--green-ink)}
.compare-col.new ul li{color:var(--ink)}

.trial{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);background:#fff;border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:var(--shadow)}
.trial-copy{padding:40px;background:linear-gradient(160deg,#065F46,#047857);color:#fff;display:flex;flex-direction:column;justify-content:center}
.trial-copy h2{color:#fff;font-size:32px;line-height:1.25}
.trial-copy p{margin-top:12px;color:rgba(255,255,255,.82);font-size:15.5px;line-height:1.75}
.trial-copy ul{margin-top:18px;display:grid;gap:8px;font-size:14.5px}
.trial-copy ul li{display:flex;gap:8px}
.trial-copy ul li .ic{width:18px;height:18px;margin-top:3px;color:#A7F3D0}
.trial-form{padding:40px}
.trial-form h3{font-size:20px}
.trial-form .form{margin-top:20px}
.trial-form .btn{width:100%}

.partner-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.partner{background:#fff;border:1px solid var(--line);border-radius:var(--r-small);padding:18px 16px;font-size:14.5px;font-weight:600;color:var(--ink);text-align:center;line-height:1.5}
.partner span{display:block;font-size:12.5px;font-weight:400;color:var(--ink-3);margin-top:3px}

@media (max-width:1199px){
  .hero-copy h1{font-size:50px}
  .hv-phone{right:0}
}
@media (max-width:1023px){
  .hero-grid{grid-template-columns:minmax(0,1fr);min-height:0;padding:40px 0 48px;gap:28px}
  .hero-copy h1{font-size:44px}
  .hero-visual{min-height:520px}
  .hv-ip{width:300px}
  .hero-grid>.hero-visual{order:-1}
  .idea{grid-template-columns:44px minmax(0,1fr)}
  .idea p{grid-column:2}
  .flow{grid-template-columns:minmax(0,1fr)}
  .dual,.compare,.trial{grid-template-columns:minmax(0,1fr)}
  .partner-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .feat-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:639px){
  .hero-grid{padding:28px 0 40px}
  .hero-copy h1{font-size:36px}
  .hero-sub{font-size:16.5px}
  .hero-actions .btn{width:100%}
  /* 移动端 Hero 视觉区改为纵向堆叠：角色在上、手机完整居中在下、信息牌静态排布，
     不再绝对定位叠压（避免遮挡界面、避免手机框被视口裁切） */
  .hero-visual{min-height:0;display:flex;flex-direction:column;align-items:center;gap:14px}
  .hv-stage{position:relative;inset:auto;width:100%;height:260px}
  .hv-ip{width:210px}
  .hv-phone{position:static;right:auto;bottom:auto}
  .hv-phone .phone{width:210px}
  .hv-chip{position:static;white-space:normal;text-align:center;justify-content:center}
  .hv-chip-c{right:auto}
  .hv-ring{width:260px;height:260px}
  .hv-ring.r2{width:320px;height:320px}
  .hv-halo{width:260px;height:260px}
  .idea{padding:20px}
  .idea-no{width:38px;height:38px}
  .dual-card{padding:22px;min-height:0}
  .dual-card .dv{font-size:44px}
  .feat-grid{grid-template-columns:minmax(0,1fr)}
  .partner-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .trial-copy,.trial-form{padding:26px 22px}
  .trial-copy h2{font-size:26px}
}
@media (max-width:359px){.hero-copy h1{font-size:32px}}
</style>
</head>
<body>
