<style>
/* ===== 下载页专属 ===== */
.dl-hero{padding:56px 0 64px;background:radial-gradient(1100px 500px at 8% -10%,rgba(16,185,129,.16),transparent 60%)}
.dl-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:56px;align-items:start}
.dl-main h1{font-size:48px;font-weight:600;line-height:1.16;letter-spacing:-.02em;margin-top:16px}
.dl-main .lead{margin-top:16px;font-size:17.5px;color:var(--ink-2);max-width:560px;line-height:1.8}
.dl-meta{display:flex;flex-wrap:wrap;gap:8px 22px;margin:24px 0 26px;font-size:14px;color:var(--ink-3)}
.dl-meta span{display:inline-flex;align-items:center;gap:7px}
.dl-meta .ic{width:15px;height:15px;color:var(--green-ink)}
.dl-actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.dl-note{margin-top:16px;font-size:13.5px;line-height:1.7;color:var(--ink-3);max-width:560px}
.dl-hash{margin-top:12px;font-family:var(--mono);font-size:11.5px;color:var(--ink-4);word-break:break-all;max-width:520px;line-height:1.6}
.dl-card{background:#fff;border:1px solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow);padding:24px;text-align:center;position:sticky;top:calc(var(--nav-h) + 24px)}
.dl-card h2{font-size:15px;font-weight:600;color:var(--ink)}
.dl-card .qr{width:100%;max-width:220px;margin:16px auto 0;border-radius:12px;border:1px solid var(--line);padding:8px;background:#fff}
.dl-card .qr img{width:100%;display:block}
.dl-card p{font-size:13px;color:var(--ink-3);line-height:1.65;margin-top:12px}
.dl-card .ver-list{margin-top:16px;padding-top:16px;border-top:1px solid var(--line-2);display:grid;gap:8px;font-size:13.5px}
.dl-card .ver-list div{display:flex;justify-content:space-between;gap:10px}
.dl-card .ver-list dt{color:var(--ink-3)}
.dl-card .ver-list dd{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.req-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.req{background:#fff;border:1px solid var(--line);border-radius:var(--r-small);padding:20px}
.req h3{font-size:15.5px}
.req ul{margin-top:10px;display:grid;gap:7px}
.req li{font-size:14px;color:var(--ink-2);line-height:1.6;display:flex;gap:8px}
.req li .ic{width:15px;height:15px;margin-top:3px;flex:none;color:var(--green-ink)}
.source-dual{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.src-card{border:1px solid var(--line);border-radius:var(--r-card);padding:24px;background:#fff;display:flex;flex-direction:column}
.src-card.rec{background:var(--green-bg);border-color:var(--green-border)}
.src-card h3{font-size:17px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.src-card p{font-size:14px;color:var(--ink-2);margin-top:8px;line-height:1.7;flex:1}
.src-card .btn{margin-top:16px;align-self:flex-start}
.log-state{font-size:13.5px;color:var(--ink-3);margin-bottom:16px;display:flex;align-items:center;gap:8px}
.log-state .dot{width:8px;height:8px;border-radius:50%;background:var(--ink-4);flex:none}
/* 脚本在失败时会把 #log-state 的 class 换成 state state-error is-on，这里给出对应样式 */
#log-state.state{border-radius:10px;padding:12px 14px;display:flex;gap:9px;align-items:flex-start;line-height:1.65}
#log-state.state-error{background:var(--amber-bg);border:1px solid #FDE4B5;color:#7C4A03}
#log-state.state-error a{color:var(--green-ink);font-weight:600;text-decoration:underline;text-underline-offset:2px}
.log-state.is-ok .dot{background:var(--green)}
.log-state.is-cache .dot{background:var(--amber)}
.release{background:#fff;border:1px solid var(--line);border-radius:var(--r-card);padding:26px}
.release+.release{margin-top:16px}
.release-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px 14px;padding-bottom:16px;border-bottom:1px solid var(--line-2)}
.release-head h3{font-size:19px}
.release-head .when{font-size:13.5px;color:var(--ink-3)}
.release-body{margin-top:16px;font-size:14.5px;color:var(--ink-2);line-height:1.75}
.release-body h4{font-size:15px;color:var(--ink);margin:16px 0 6px}
.release-body ul{display:grid;gap:6px;margin-top:6px}
.release-body li{position:relative;padding-left:16px}
.release-body li::before{content:"";position:absolute;left:2px;top:.7em;width:5px;height:5px;border-radius:50%;background:var(--green-border)}
.release-body p+p{margin-top:8px}
.release-body code{font-family:var(--mono);font-size:12.5px;background:var(--bg-tint);border-radius:4px;padding:1px 5px}
.release-body hr{border:0;border-top:1px solid var(--line-2);margin:14px 0}
.device-warn{display:flex;gap:14px;align-items:flex-start;background:var(--amber-bg);border:1px solid #FDE4B5;border-radius:var(--r-small);padding:18px 20px;margin-top:20px}
.device-warn .ic{width:20px;height:20px;color:var(--amber-ink);margin-top:2px;flex:none}
.device-warn p{font-size:14.5px;color:#7C4A03;line-height:1.7}
@media (max-width:1023px){
  .dl-grid{grid-template-columns:minmax(0,1fr);gap:32px}
  .dl-card{position:static;max-width:320px;margin:0 auto}
  .dl-main h1{font-size:38px}
  .req-grid{grid-template-columns:minmax(0,1fr)}
  .source-dual{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:639px){
  .dl-hero{padding:36px 0 44px}
  .dl-main h1{font-size:31px}
  .dl-main .lead{font-size:16px}
  .dl-actions .btn{width:100%}
  .release,.dl-card{padding:20px}
}
</style>
</head>
<body>
