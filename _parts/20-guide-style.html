<style>
/* ===== 新手指南专属 ===== */
.tut{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,320px);gap:48px;align-items:start;padding:64px 0;border-top:1px solid var(--line-2)}
.tut:first-of-type{border-top:0;padding-top:8px}
.tut-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:8px}
.tut-no{flex:none;width:44px;height:44px;border-radius:12px;background:var(--green);color:#fff;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 18px -8px rgba(16,185,129,.6)}
.tut-head h2{font-size:28px;font-weight:600;line-height:1.3;letter-spacing:-.01em}
.tut-head .meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.tut-intro{font-size:16px;color:var(--ink-2);line-height:1.8;margin-bottom:22px}
.tut-side{position:sticky;top:calc(var(--nav-h) + 24px)}
.tut-side .phone{width:100%;max-width:280px}
.tut-side .shot-caption{margin-top:12px}
.tut-tips{margin-top:26px;background:var(--bg-tint);border-radius:var(--r-small);padding:18px 20px}
.tut-tips h4{font-size:14px;color:var(--ink);margin-bottom:10px}
.tut-tips ul{display:grid;gap:8px}
.tut-tips li{font-size:14px;color:var(--ink-2);line-height:1.65;display:flex;gap:8px}
.tut-tips li .ic{width:16px;height:16px;margin-top:3px;color:var(--green-ink);flex:none}
.faq-mini{margin-top:26px}
.faq-mini h4{font-size:14px;margin-bottom:10px}
.faq-mini .acc{border-radius:var(--r-small)}
.faq-mini .acc summary{padding:14px 16px;font-size:14.5px}
.faq-mini .acc .acc-body{padding:0 16px 16px;font-size:14px}
.step .sub-note{display:block;margin-top:4px;font-size:13.5px;color:var(--ink-3);line-height:1.6}
.jump{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:8px}
.jump a{background:#fff;border:1px solid var(--line);border-radius:var(--r-small);padding:14px 16px;font-size:14.5px;color:var(--ink);font-weight:600;display:flex;flex-direction:column;gap:4px;transition:border-color .2s,transform .2s var(--ease)}
.jump a:hover{border-color:var(--green-border);transform:translateY(-2px)}
.jump a span{font-size:12.5px;font-weight:400;color:var(--ink-3)}
.jump a b{font-size:11.5px;font-weight:700;color:var(--green-ink);letter-spacing:.06em}
@media (max-width:1023px){
  .tut{grid-template-columns:minmax(0,1fr);gap:28px;padding:44px 0}
  .tut-side{position:static;order:-1;display:flex;gap:20px;align-items:flex-start}
  .tut-side .phone{max-width:220px}
  .tut-side .shot-caption{max-width:220px}
  .tut-head h2{font-size:23px}
  .jump{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:639px){
  .tut{padding:36px 0}
  .tut-side{flex-direction:column}
  .tut-side .phone{max-width:200px;margin:0}
  .tut-head h2{font-size:20px}
  .tut-no{width:38px;height:38px;font-size:15px}
  .jump{grid-template-columns:minmax(0,1fr)}
}
</style>
</head>
<body>
