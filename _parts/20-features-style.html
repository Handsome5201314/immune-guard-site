<style>
/* ===== 功能页专属 ===== */
.legend{display:flex;flex-wrap:wrap;gap:10px 18px;margin-top:22px;font-size:14px;color:var(--ink-2);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:8px}
.feat-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:64px;align-items:center;padding:72px 0;border-top:1px solid var(--line-2)}
.feat-row:first-of-type{border-top:0;padding-top:8px}
.feat-row.flip>.feat-copy{order:2}
.feat-copy .row-tags{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.feat-copy h2{font-size:32px;font-weight:600;line-height:1.25;letter-spacing:-.015em}
.feat-copy .sub{margin-top:12px;font-size:16.5px;color:var(--ink-2);line-height:1.8}
.feat-copy ul{margin-top:20px;display:grid;gap:10px}
.feat-copy ul li{display:flex;gap:10px;font-size:15px;color:var(--ink-2);line-height:1.65}
.feat-copy ul li .ic{width:18px;height:18px;margin-top:3px;color:var(--green-ink);flex:none}
.feat-copy ul li.na .ic{color:var(--ink-4)}
.feat-copy .note{margin-top:20px}
.feat-visual{display:flex;justify-content:center;align-items:flex-start;position:relative}
.feat-visual.stack{flex-direction:row;gap:16px;align-items:flex-start;justify-content:center;flex-wrap:wrap}
.feat-visual .phone{width:250px}
.feat-visual .phone-screen.natural{max-height:none}
.feat-visual .annot-list{display:grid;gap:10px;max-width:230px;font-size:14px;color:var(--ink-2);line-height:1.6;align-self:center}
.feat-visual .annot-list b{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:var(--green);color:#fff;font-size:12px;font-weight:700;margin-right:8px;flex:none}
.feat-visual .annot-list b.amber{background:var(--amber)}
.feat-visual .annot-list b.mist{background:var(--mist)}
.feat-visual .annot-list span{display:flex;align-items:flex-start}
.feat-visual .shot-frame{max-width:300px}
.hero-legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.hero-legend .tag{font-size:13px;padding:5px 12px}
.tbl-wrap.feat-tbl td:first-child{white-space:normal;min-width:120px}
.tbl-wrap.feat-tbl td:nth-child(3){min-width:180px}
.device-hero{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-top:8px}
.dev-card{background:#fff;border:1px solid var(--line);border-radius:var(--r-card);padding:26px;display:flex;flex-direction:column;gap:12px}
.dev-card h3{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dev-card dl{display:grid;gap:10px;font-size:14.5px}
.dev-card dl div{display:grid;grid-template-columns:92px minmax(0,1fr);gap:10px}
.dev-card dt{color:var(--ink-3)}
.dev-card dd{color:var(--ink)}
.dev-card .st{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600}
.dev-card .st::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--green)}
.dev-card .st.beta::before{background:var(--mist)}
.dev-card .st.plan::before{background:var(--ink-4)}
.privacy-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:22px}
.privacy-list div{background:#fff;border:1px solid var(--line);border-radius:var(--r-small);padding:16px;font-size:14.5px;line-height:1.6}
.privacy-list b{display:block;font-size:15px;color:var(--ink)}
.privacy-list span{color:var(--ink-3);font-size:13px}
.coming{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.coming .card{opacity:.92}
.coming .card .eta{margin-top:14px;font-size:13px;color:var(--ink-3)}
@media (max-width:1023px){
  .feat-row{grid-template-columns:minmax(0,1fr);gap:32px;padding:52px 0}
  .feat-row.flip>.feat-copy{order:0}
  .feat-row>.feat-visual{order:-1}
  .feat-copy h2{font-size:27px}
  .privacy-list,.coming{grid-template-columns:repeat(2,minmax(0,1fr))}
  .device-hero{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:639px){
  .feat-row{padding:40px 0;gap:24px}
  .feat-copy h2{font-size:23px}
  .feat-visual .phone{width:220px}
  .feat-visual.stack .phone{width:180px}
  .feat-visual.stack{flex-direction:column;align-items:center}
  .feat-visual .annot-list{max-width:100%}
  .privacy-list,.coming{grid-template-columns:minmax(0,1fr)}
  .dev-card{padding:20px}
}
</style>
</head>
<body>
